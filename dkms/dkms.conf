PACKAGE_NAME="atlantic-dash"
PACKAGE_VERSION="0.1.0"

# Sources are fetched for each kernel (upstream atlantic at the matching stable tag) and patched.
PRE_BUILD="fetch-and-patch.sh ${kernelver} ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/linux"

BUILT_MODULE_NAME[0]="atlantic"
BUILT_MODULE_LOCATION[0]="linux/drivers/net/ethernet/aquantia/atlantic"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/linux/drivers/net/ethernet/aquantia/atlantic CONFIG_AQTION=m modules"
CLEAN="rm -rf linux"

AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^7\.0\."
